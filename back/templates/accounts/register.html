{% extends "base.html" %}
{% load static %}

{% block title %}Page de connexion{% endblock %}
{% block head%}
  <script src="{% static 'js/app.js' %}" defer></script>
{% endblock %}
{% block content %}

<main class="auth-page register-page">
    <h1>Page d'inscription</h1>

    <form action="/api/accounts/register/" method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="field">
        <label for="username">Nom d'utilisateur <span class="req">*</span></label>
        <input
          type="text"
          id="username"
          name="username"
          required
          minlength="4"
          maxlength="10"
          placeholder="4 à 10 caractères" />
      </div>

      <div class="field">
        <label for="password">Mot de passe <span class="req">*</span></label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="10 caractères"
          required />
      </div>

      <div class="field">
        <label for="conf_passw">Confirmation mot de passe <span class="req">*</span></label>
        <input
          type="password"
          id="conf_passw"
          name="conf_passw"
          placeholder="10 caractères"
          required />
        <p id="passw-msg">Les mots de passe ne correspondent pas.</p>
      </div>

      <hr />

      <div class="field">
        <label for="last_name">Nom</label>
        <input
          type="text"
          id="last_name"
          name="last_name"
          minlength="2"
          maxlength="50" />
      </div>

      <div class="field">
        <label for="first_name">Prénom</label>
        <input
          type="text"
          id="first_name"
          name="first_name"
          minlength="2"
          maxlength="50" />
      </div>

      <div class="field">
        <label>Genre</label>
        <div class="gender-row">
          <label>
            <input type="radio" id="male" name="sex" value="male" />
            Homme
          </label>
          <label>
            <input type="radio" id="female" name="sex" value="female" />
            Femme
          </label>
          <label>
            <input type="radio" id="NB" name="sex" value="NB" />
            Il est hors de question que je vous le dise
          </label>
        </div>
      </div>

      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email" />
      </div>

      <div class="field">
        <label for="adresse">Adresse postale</label>
        <input
          type="text"
          id="adresse"
          name="adresse" />
      </div>

      <div class="field">
        <label for="birth_date">Date de naissance</label>
        <input
          type="date"
          id="birth_date"
          name="birth_date" />
      </div>

      <div class="field">
        <label for="image">Photo de profil</label>
        <input type="file" id="image" name="profile_pic" accept="image/*" />
        <img id="apercu" src="" alt="Aperçu" />
      </div>

      <input type="submit" name="nouveau" value="S'inscrire" />

    </form>

  </main>

{% endblock %}
{% block scripts %}
<script src="{% static 'js/app.js' %}" defer></script>
{% endblock %}
