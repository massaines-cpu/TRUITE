{% extends "base.html" %}
{% load static %}

{% block title %}Page de connexion{% endblock %}

{% block content %}

<main class="auth-page">
  <h1>Page de connexion</h1>

  <form id="login-form" action="/api/accounts/login/" method="post">
    {% csrf_token %}

    <div class="field">
      <label for="username">Nom d'utilisateur <span class="req">*</span></label>
      <input type="text" id="username" name="username" required />
    </div>

    <div class="field">
      <label for="password">Mot de passe <span class="req">*</span></label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required />
    </div>

    <p id="login-msg"></p>

    <input type="submit" value="Se connecter" />

    <p class="auth-switch">Pas encore de compte ? <a href="/register/">Créer un compte</a></p>
  </form>

</main>

{% endblock %}
{% block scripts %}
<script src="{% static 'js/geoloc.js' %}"></script>
<script src="{% static 'js/app.js' %}" defer></script>
{% endblock %}
