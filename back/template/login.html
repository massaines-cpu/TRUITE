<!DOCTYPE html>
<html lang="fr">
<head>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <title>Page de connexion</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="fonctions.js" defer></script>
</head>
  <title>Page de connexion</title>

<body>
<h1>Page de connexion</h1>
 
  <form action="/login" method="post">
 
    <div class="field">
      <label for="username">Nom d'utilisateur <span class="req">*</span></label>
      <input type="text" id="username" name="username" required />
    </div>
 
    <div class="field">
      <label for="passw">Mot de passe <span class="req">*</span></label>
      <input type="password" id="passw" name="passw" autocomplete="current-password" required />
    </div>
 
    <input type="submit" value="Se connecter" />
 
  </form>
</body>
</html>
