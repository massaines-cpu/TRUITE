{% extends "app_truite/base.html" %}
{% block title %}Page de connexion {% endblock %}
{% block content %}

<h1>Page de connexion</h1>
 
  <form action="/login" method="post">
    {% csrf_token %}
 
    <div class="field">
      <label for="username">Nom d'utilisateur <span class="req">*</span></label>
      <input type="text" id="username" name="username" required />
    </div>
 
    <div class="field">
      <label for="passw">Mot de passe <span class="req">*</span></label>
      <input type="password" id="passw" name="passw" autocomplete="current-password" required />
    </div>
 
    <input type="submit" value="Se connecter" />
 
  </form>
  {% endblock %}
